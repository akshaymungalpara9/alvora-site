# Railway build configuration.
#
# Installs the system libraries that Playwright's bundled Chromium requires on
# Ubuntu 22.04. Installing them here (in the nixpacks setup phase) is more
# reliable than using `playwright install --with-deps` during the build phase,
# because nixpacks owns apt-get in the setup phase but not in the build phase.
#
# After these libraries are in place, `npx playwright install chromium` in the
# build step downloads only the Chromium binary — no further apt access needed.
[phases.setup]
aptPkgs = [
  "libnss3", "libnspr4",
  "libatk1.0-0", "libatk-bridge2.0-0",
  "libcups2", "libdrm2", "libdbus-1-3",
  "libxkbcommon0", "libxcomposite1", "libxdamage1",
  "libxfixes3", "libxrandr2", "libgbm1",
  "libasound2", "libpango-1.0-0", "libcairo2",
  "libxshmfence1", "libx11-xcb1"
]

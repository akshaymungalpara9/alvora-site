# Railway build configuration.
#
# chromium from nixPkgs is a self-contained Nix package that bundles its own
# system libraries. It is more reliable than the `chromium-browser` apt package
# (a snap meta-package on Ubuntu 22.04 that cannot run in containers) or listing
# individual apt dependencies that differ across Ubuntu versions.
#
# If chromium still cannot launch in the Railway build environment, scripts/prerender.mjs
# falls back to the committed prerendered/ snapshots at the project root, so the
# deployed site always has real body content for crawlers regardless of browser
# availability. Run `pnpm prerender` locally and commit prerendered/ to refresh.
[phases.setup]
nixPkgs = ["chromium"]
